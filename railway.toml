## Railway service config for `mdproject-web` (the Django app).
##
## This file is the project default — Railway reads `railway.toml` from
## the repo root. The `mdproject-worker` service uses a sibling file,
## `railway.worker.toml`, configured per-service via Settings → Config
## Path. See RAILWAY.md §5 for the one-time setup.
##
## DO NOT set `startCommand` here. For Dockerfile-based services Railway's
## startCommand REPLACES the image's ENTRYPOINT entirely (it does NOT
## append to CMD), so e.g. `startCommand = "web"` would try to exec a
## "web" binary that doesn't exist. Leaving it unset lets the Dockerfile's
## ENTRYPOINT ["/app/docker-entrypoint.sh"] + CMD ["web"] apply naturally
## — that's the right default for the web service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
# 30s isn't enough on a cold deploy: the entrypoint runs migrate (apps
# load + system checks + DB connect — easily 10-20s on a fresh container)
# BEFORE gunicorn binds port 8000. 300s gives migrations room even if
# Postgres is briefly slow to accept the first connection.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
