{% extends 'admin/base_admin.html' %}

{% block title %}Tournaments{% endblock title %}

{% block content %}
<div class="container">
    <h1>Tournaments</h1>
    <div class="list-group">
        {% for tournament in tournaments %}
            <a href="{% url 'core_admin:tournament-detail' tournament.id %}" class="list-group-item list-group-item-action">
                {{ tournament.name }} - Starts on {{ tournament.start_date|date:"Y-m-d" }}
            </a>
        {% endfor %}
    </div>
</div>
{% endblock content %}
