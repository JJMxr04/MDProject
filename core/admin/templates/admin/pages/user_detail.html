{% extends "admin/base_admin.html" %}

{% block content %}
<div class="container mt-4">
    <h2>User Details</h2>
    <form>
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" value="{{ user.username }}" readonly>
        </div>
        <div class="mb-3">
            <label for="first_name" class="form-label">First Name</label>
            <input type="text" class="form-control" id="first_name" value="{{ user.first_name }}" readonly>
        </div>
        <div class="mb-3">
            <label for="last_name" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="last_name" value="{{ user.last_name }}" readonly>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" value="{{ user.email }}" readonly>
        </div>
        <div class="mb-3">
            <label for="bio" class="form-label">Bio</label>
            <textarea class="form-control" id="bio" rows="3" readonly>{{ user.bio }}</textarea>
        </div>
        <div class="mb-3">
            <label for="avatar" class="form-label">Avatar</label>
            {% if user.avatar %}
            <img src="{{ user.avatar.url }}" alt="Avatar" class="img-thumbnail">
            {% else %}
            <p>No avatar uploaded.</p>
            {% endif %}
        </div>
        <a href="{% url 'core_admin:user-list' %}" class="btn btn-secondary">Back to List</a>
    </form>
</div>
{% endblock content %}
