<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    {% load static %}
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- FontAwesome CSS for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" integrity="sha384-KyZXEAg3QhqLMpG8r+Knujsl5+5hb7x1l5eD5AWxjz5e5VR7PyjR+X0dEw+75qg0" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'css/admin/admin_main.css' %}">
    <title>{% block title %}Admin{% endblock title %}</title>
    {% block css %}{% endblock css %}
</head>
<body>
    <header>
        {% include "admin/components/navbar.html" %}
        <button class="btn btn-primary toggle-btn" id="toggle-btn">☰</button>
    </header>
    <div class="sidebar" id="sidebar">
        {% include "admin/components/sidebar.html" %}
    </div>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 p-4">
                <div class="comp-container" id="main-content">
                    {% block content %}{% endblock content %}
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script>
        document.getElementById('toggle-btn').addEventListener('click', function() {
            var sidebar = document.getElementById('sidebar');
            var mainContent = document.getElementById('main-content');
            var navbar = document.querySelector('.navbar');
            var toggleBtn = document.querySelector('.toggle-btn');

            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('collapsed');
            navbar.classList.toggle('collapsed');
            toggleBtn.classList.toggle('collapsed');

            if (sidebar.classList.contains('collapsed')) {
                toggleBtn.style.left = '10px';
            } else {
                toggleBtn.style.left = '260px';
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            var sidebarMenu = document.getElementById('sidebar-menu');
            var navLinks = sidebarMenu.getElementsByClassName('nav-link');

            var currentPath = window.location.pathname;

            for (var i = 0; i < navLinks.length; i++) {
                var linkPath = navLinks[i].getAttribute('href');

                if (currentPath === linkPath) {
                    navLinks[i].classList.add('active');
                } else {
                    navLinks[i].classList.remove('active');
                }
            }
        });
    </script>
    {% block js %}{% endblock js %}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.0/js/bootstrap.bundle.min.js" integrity="sha384-n3Bn4eFzssis1n7Ea94pO/u6dKG5/PJ/r05KlN2Z0H2Q6yA7RjtiVXy8q0F1+8+W" crossorigin="anonymous"></script>
    <script>
        const csrfToken = "{{ csrf_token }}";
    </script>
</body>
</html>
