
<div class="check-card check-card--{{ item.state.value }}" id="check-card-{{ name }}">
  <span class="check-card__dot" aria-hidden="true"></span>
  <div class="check-card__body">
    <div class="check-card__title">{{ title }}</div>
    <div class="check-card__label">{{ item.label }}</div>
    {% if item.detail %}
      <div class="check-card__detail">{{ item.detail }}</div>
    {% endif %}
    <div class="check-card__footer">
      <span class="check-card__checked">checked {% now "H:i:s" %} UTC</span>
      <button type="button" class="check-card__ping-btn" data-check="{{ name }}">Ping</button>
    </div>
  </div>
</div>
