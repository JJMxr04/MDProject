{% extends "portal/base_portal.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block css %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/portal/blog/writer/create-article.css' %}">
{% endblock css %}
{% block title %}Update Article{% endblock title %}



{% block content %}
<div class="bg-white shadow-md p-5 form-layout mt-0 rounded">
    <h3 class="mb-4 text-left"> 🤓 Update your Article 🤓</h3>
    <form method="POST" autocomplete="off">
        {% csrf_token %}
        <div class="form-group text-left">
            {{ UpdateArticleForm|crispy }}
        </div>
        <br>
        <br>
        <input class="btn btn-success btn-lg mt-3" type="submit" value="Update Article">
    </form>
</div>

{% endblock content %}
