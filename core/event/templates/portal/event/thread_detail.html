{% extends "portal/base_portal.html" %}
{% load static %}

{% block css %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/portal/event/thread_detail.css' %}">
{% endblock css %}

{% block title %}Create Post{% endblock title %}

{% block content %}
    <div class="container mt-4">
        <h1 class="mb-4">Create Post</h1>
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="form-group">
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg">Post</button>
                </form>
                <div class="mt-3">
                    <a href="{% if thread %}{% url 'core-portal:thread_detail' thread.id %}{% else %}{% url 'core-portal:upcoming-events-detail' event.id %}{% endif %}" class="btn btn-secondary">Back</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
