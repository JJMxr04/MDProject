{% comment %}Team logo with initials fallback.
ctx: team (dict: name, logo_url) · size (px, default 48){% endcomment %}
{% if team.logo_url %}
<img class="team-logo" src="{{ team.logo_url }}" alt="{{ team.name }}"
     style="--logo-size: {{ size|default:48 }}px;">
{% else %}
<span class="team-logo team-logo--fallback" style="--logo-size: {{ size|default:48 }}px;"
      aria-hidden="true">{{ team.name|slice:":2"|upper }}</span>
{% endif %}
