{% load static %}
<header class="topbar" role="banner">
    <button class="sidebar-toggle" type="button" aria-label="Toggle navigation" data-sidebar-toggle>
        <i class="bi bi-list" aria-hidden="true"></i>
    </button>

    <a class="topbar__brand" href="{% url 'core-portal:portal-dashboard' %}">
        <img src="{% static 'assets/Logo/paradise_logo_2_normal.png' %}" alt="Paradise">
    </a>

    <div class="topbar__spacer"></div>

    <button class="topbar__bell btn-ui btn-ui--ghost btn-ui--icon-only" type="button"
            data-theme-toggle aria-label="Theme">
        <i class="bi bi-circle-half" aria-hidden="true"></i>
    </button>

    {% if request.user.is_authenticated %}
    <a class="topbar__bell btn-ui btn-ui--ghost btn-ui--icon-only" href="{% url 'core-portal:invite-list' %}" aria-label="Invites">
        <i class="bi bi-envelope" aria-hidden="true"></i>
        {% if request.user.has_pending_invites %}<span class="topbar__bell-dot" aria-hidden="true"></span>{% endif %}
    </a>

    <div class="dropdown" data-island="notifications"
         data-src="{% url 'api-v1:notifications-list' %}"
         data-refresh-interval="60000"
         x-data="notifications">
        <button class="topbar__bell btn-ui btn-ui--ghost btn-ui--icon-only" type="button"
                data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false"
                aria-label="Notifications" :aria-busy="isLoading">
            <i class="bi bi-bell" aria-hidden="true"></i>
            <span class="topbar__bell-dot" x-show="hasItems" x-text="count"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end notification-dropdown">
            <template x-if="isLoading"><li class="dropdown-item">Loading…</li></template>
            <template x-if="isError"><li class="dropdown-item" x-text="errorMessage"></li></template>
            <template x-if="isEmpty"><li class="dropdown-item">No new notifications</li></template>
            <template x-for="n in items" :key="n.id">
                <li class="dropdown-item notification-item">
                    <span class="notification-item__msg" role="button" tabindex="0"
                          :data-id="n.id" @click="markRead" x-text="n.message"></span>
                    <button type="button" class="notification-item__clear"
                            :data-id="n.id" @click.stop="clear" aria-label="Clear notification" title="Clear">
                        <i class="bi bi-x-lg" aria-hidden="true"></i>
                    </button>
                </li>
            </template>
            <template x-if="hasItems">
                <li class="notification-actions">
                    <button type="button" class="btn-ui btn-ui--ghost btn-ui--sm" @click="markAllRead">Mark all read</button>
                    <button type="button" class="btn-ui btn-ui--danger btn-ui--sm" @click="clearAll">Clear all</button>
                </li>
            </template>
        </ul>
    </div>

    {% include "portal/components/_avatar_menu.html" %}
    {% endif %}
</header>
