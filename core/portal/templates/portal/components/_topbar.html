{% load static %}
<header class="topbar" role="banner">
    <button class="sidebar-toggle" type="button" aria-label="Toggle navigation" data-sidebar-toggle>
        <i class="bi bi-list" aria-hidden="true"></i>
    </button>

    <a class="topbar__brand" href="{% url 'core-portal:portal-dashboard' %}">
        <img src="{% static 'assets/Logo/paradise_logo_2_normal.png' %}" alt="Paradise">
    </a>

    <div class="topbar__spacer"></div>

    {% if request.user.is_authenticated %}
    <a class="topbar__bell btn-ui btn-ui--ghost btn-ui--icon-only" href="{% url 'core-portal:invite-list' %}" aria-label="Invites">
        <i class="bi bi-bell" aria-hidden="true"></i>
        {% if request.user.received_invites.exists %}<span class="topbar__bell-dot" aria-hidden="true"></span>{% endif %}
    </a>
    {% include "portal/components/_avatar_menu.html" %}
    {% endif %}
</header>
