{# Expects: page_obj (Django Paginator page), querystring (string, no leading ?, no `page=` param) #}
{% if page_obj.paginator.num_pages > 1 %}
<nav class="pager" aria-label="Pagination">
    <a class="pager__btn"
       {% if page_obj.has_previous %}
           href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number }}"
       {% else %}
           aria-disabled="true"
       {% endif %}>
        <i class="bi bi-chevron-left" aria-hidden="true"></i> Prev
    </a>
    <span class="pager__pages">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    <a class="pager__btn"
       {% if page_obj.has_next %}
           href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number }}"
       {% else %}
           aria-disabled="true"
       {% endif %}>
        Next <i class="bi bi-chevron-right" aria-hidden="true"></i>
    </a>
</nav>
{% endif %}
