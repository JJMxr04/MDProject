{% load static %}
<div class="dropdown">
    <button class="btn-ui btn-ui--ghost btn-ui--icon-only" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Account menu">
        {% include "portal/components/_avatar.html" with user=request.user size=36 %}
    </button>
    <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="{% url 'core-portal:profile' %}"><i class="bi bi-person me-2"></i>Profile</a></li>
        <li><a class="dropdown-item" href="{% url 'core-portal:friend_search' %}"><i class="bi bi-people me-2"></i>Friends</a></li>
        <li><hr class="dropdown-divider"></li>
        <li>
            <form method="post" action="{% url 'logout' %}" class="px-2">
                {% csrf_token %}
                <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
            </form>
        </li>
    </ul>
</div>
