{% load static %}
{# Mobile bottom tab bar — shown only ≤768px (see .bottom-nav in global.css).
   "More" reuses the sidebar drawer toggle so the full nav stays one tap away. #}
<nav class="bottom-nav" aria-label="Primary mobile">
    <a class="bottom-nav__item {% if request.path == '/web/portal/dashboard/' %}is-active{% endif %}"
       href="{% url 'core-portal:portal-dashboard' %}">
        <i class="bi bi-house" aria-hidden="true"></i><span>Home</span>
    </a>
    <a class="bottom-nav__item {% if '/web/portal/match/' in request.path and '/duels/' not in request.path %}is-active{% endif %}"
       href="{% url 'core-portal:portal-my-match-list' %}">
        <i class="bi bi-controller" aria-hidden="true"></i><span>Matches</span>
    </a>
    <a class="bottom-nav__item {% if '/web/portal/leaderboard/' in request.path %}is-active{% endif %}"
       href="{% url 'core-portal:portal-leaderboard' %}">
        <i class="bi bi-bar-chart" aria-hidden="true"></i><span>Ranks</span>
    </a>
    <a class="bottom-nav__item {% if '/web/portal/mail/' in request.path %}is-active{% endif %}"
       href="{% url 'core-portal:invite-list' %}">
        <i class="bi bi-envelope" aria-hidden="true"></i><span>Invites</span>
        {% if request.user.received_invites.exists %}<span class="bottom-nav__dot" aria-hidden="true"></span>{% endif %}
    </a>
    <button class="bottom-nav__item" type="button" data-sidebar-toggle aria-label="More navigation">
        <i class="bi bi-list" aria-hidden="true"></i><span>More</span>
    </button>
</nav>
