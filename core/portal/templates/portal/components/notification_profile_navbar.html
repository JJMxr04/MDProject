{% load static %}

<li class="nav-item dropdown"
    data-island="notifications"
    data-src="{% url 'api-v1:notifications-list' %}"
    data-refresh-interval="60000"
    x-data="notifications">
    <a class="nav-link" href="#" role="button" id="notificationBell" data-bs-toggle="dropdown"
       aria-expanded="false" :aria-busy="isLoading">
        <i class="bi bi-bell"></i>
        <span class="notification-badge" x-show="hasItems" x-text="count"></span>
    </a>
    <ul class="dropdown-menu notification-dropdown">
        <template x-if="isLoading"><li class="dropdown-item">Loading…</li></template>
        <template x-if="isError"><li class="dropdown-item" x-text="errorMessage"></li></template>
        <template x-if="isEmpty"><li class="dropdown-item">No new notifications</li></template>
        <template x-for="n in items" :key="n.id">
            <li class="dropdown-item" role="button" tabindex="0" @click="markRead(n.id)" x-text="n.message"></li>
        </template>
    </ul>
</li>

<!-- User Profile -->
<li class="nav-item dropdown">
    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-person-circle" style="font-size: 1.5rem;"></i>
    </a>
    <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="{% url 'core-portal:profile' %}">Profile</a></li>
        <li><a class="dropdown-item" href="{% url 'core-portal:friend_search' %}">Friends</a></li>
        <li><hr class="dropdown-divider" /></li>
        <li>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="dropdown-item">Logout</button>
            </form>
        </li>
    </ul>
</li>
