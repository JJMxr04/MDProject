<header class="page-header">
    <div>
        <h1 class="page-header__title">{{ title }}</h1>
        {% if subtitle %}<p class="page-header__subtitle">{{ subtitle }}</p>{% endif %}
    </div>
    {% if actions_include %}
        <div class="page-header__actions">
            {% include actions_include %}
        </div>
    {% endif %}
</header>
