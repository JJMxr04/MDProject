<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    {% load static %}
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- FontAwesome CSS for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" integrity="sha384-KyZXEAg3QhqLMpG8r+Knujsl5+5hb7x1l5eD5AWxjz5e5VR7PyjR+X0dEw+75qg0" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'css/portal/portal_layout.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/portal/navbar.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <title>{% block title %}Portal{% endblock title %}</title>
    {% block css %}{% endblock css %}
</head>
<body>
    <header>
        {% include "portal/components/navbar.html" %}
    </header>
    <main>
        <div class="container-fluid">
            <div class="row">
                <div class="col-10 offset-2 p-4">
                    <div class="comp-container" id="main-content">
                        {% block content %}{% endblock content %}
                    </div>
                </div>
            </div>
        </div>
    </main>
<!--    <footer class="footer mt-auto">-->
<!--        <div class="footer-container">-->
<!--            &lt;!&ndash; Portal-specific footer content &ndash;&gt;-->
<!--        </div>-->
<!--    </footer>-->
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    {% block scripts %}{% endblock scripts %}
</body>
</html>
