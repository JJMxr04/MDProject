<!-- templates/base_portal.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    {% load static %}
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- FontAwesome CSS for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" integrity="sha384-KyZXEAg3QhqLMpG8r+Knujsl5+5hb7x1l5eD5AWxjz5e5VR7PyjR+X0dEw+75qg0" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'css/public/main.css' %}">
    <title>{% block title %}Portal{% endblock title %}</title>
    {% block css %}{% endblock css %}
</head>
<body>
    <header>
        {% include "portal/components/navbar.html" %}
    </header>
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">
            {% include "portal/components/sidebar.html" %}
        </div>
        <div id="layoutSidenav_content">
            <main>
                {% block content %}{% endblock content %}
            </main>
            <footer>
                <!-- Portal-specific footer content -->
            </footer>
        </div>
    </div>
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-LtrjvnR4ABlwkNV//VXKRr7znSdW4V5w5ohP8EXBxxC27sD+/2/ZTeWDa4FQZq7N" crossorigin="anonymous"></script>
    {% block scripts %}{% endblock scripts %}
</body>
</html>
