{% extends "public/base.html" %}
{% load static %}

{% block title %}Waitlist{% endblock title %}

{% block css %}
  <link rel="stylesheet" type="text/css" href="{% static 'css/login.css' %}">
{% endblock css %}

{% block content %}
<div class="container">
  <div class="row justify-content-center align-items-center">
    <div class="col-md-6">
      <div class="card bg-light text-black border-0 rounded-3 register-form-1">
        <div class="card-body p-5 text-center">
          <h2 class="fw-bold mb-2 text-uppercase">Join the Waitlist</h2>
          <p class="text-black-50 mb-5">Enter your details to join the waitlist!</p>

          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btnSubmit btn-lg px-5" type="submit">Join</button>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
