<style>
    /* Settings shell — mirrors the profile/billing rail layout. */
    .settings-layout { display: grid; grid-template-columns: 220px 1fr; gap: var(--space-6); align-items: flex-start; }
    .settings-rail ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--space-1); }
    .settings-rail a,
    .settings-rail .is-disabled {
        display: flex; align-items: center; gap: var(--space-2);
        padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
        color: var(--text-primary); text-decoration: none;
        font-size: var(--text-sm); font-weight: var(--weight-medium);
    }
    .settings-rail a:hover { background: var(--surface-muted); }
    .settings-rail a.is-active {
        background: var(--brand-yellow); color: var(--text-on-accent);
        font-weight: var(--weight-semibold);
    }
    .settings-rail .is-disabled { color: var(--text-secondary); opacity: .6; cursor: not-allowed; }
    .settings-rail i.bi { font-size: 16px; }

    /* 2FA-specific bits */
    .twofa-status { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
    .twofa-pill { display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-3); border-radius: 999px; font-size: var(--text-xs); font-weight: var(--weight-semibold); }
    .twofa-pill--on { background: var(--state-success, #1f8a4c); color: #fff; }
    .twofa-pill--off { background: var(--surface-muted); color: var(--text-secondary); }
    .twofa-meta { color: var(--text-secondary); font-size: var(--text-sm); }
    .twofa-qr { display: flex; gap: var(--space-6); flex-wrap: wrap; align-items: flex-start; }
    .twofa-qr__code { width: 200px; height: 200px; }
    .twofa-qr__code svg { width: 100%; height: 100%; }
    .twofa-key { font-family: var(--font-mono, ui-monospace, monospace); background: var(--surface-muted); padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm, 6px); letter-spacing: .08em; word-break: break-all; }
    .twofa-form { display: flex; flex-direction: column; gap: var(--space-3); max-width: 320px; margin-top: var(--space-4); }
    .twofa-input { font-size: var(--text-lg); letter-spacing: .3em; text-align: center; padding: var(--space-2) var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-md); }
    .twofa-codes { columns: 2; list-style: none; padding: 0; margin: var(--space-4) 0; font-family: var(--font-mono, ui-monospace, monospace); font-size: var(--text-base); }
    .twofa-codes li { padding: var(--space-1) 0; letter-spacing: .12em; }
    .twofa-actions { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: flex-end; }
    .field-error { color: var(--state-danger); font-size: var(--text-sm); margin-bottom: var(--space-3); }

    @media (max-width: 768px) {
        .settings-layout { grid-template-columns: 1fr; }
    }
</style>
