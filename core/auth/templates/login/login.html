{% extends "public/base.html" %}
{% load static %}

{% block title %}Login{% endblock title %}

{% block css %}

    <link rel="stylesheet" type="text/css" href="{% static 'css/login.css' %}">
{% endblock css %}

{% block content %}
<section class="vh-100 gradient-custom">
  <div class="container py-5 ">
    <div class="row justify-content-center align-items-center ">
      <div class="col-md-6">
        <div class="card bg-dark text-white border-0 rounded-3">
          <div class="card-body p-5 text-center">
            <h2 class="fw-bold mb-2 text-uppercase">Login</h2>
            <p class="text-white-50 mb-5">Please enter your login and password!</p>

            <form method="post" action="{% url 'core-auth:login' %}" class="mb-4">
              {% csrf_token %}
              <div class="form-outline form-white mb-4">
                <input type="email" id="typeEmailX" class="form-control form-control-lg" placeholder="Email" />
              </div>
              <div class="form-outline form-white mb-4">
                <input type="password" id="typePasswordX" class="form-control form-control-lg" placeholder="Password" />
              </div>
              <button class="btn btn-outline-light btn-lg px-5" type="submit">Login</button>
            </form>

            <div class="d-flex justify-content-center text-center mt-4 pt-1">
              <a href="#!" class="text-white"><i class="fab fa-facebook-f fa-lg"></i></a>
              <a href="#!" class="text-white"><i class="fab fa-twitter fa-lg mx-4 px-2"></i></a>
              <a href="#!" class="text-white"><i class="fab fa-google fa-lg"></i></a>
            </div>

            <div>
              <p class="mb-0 mt-4">Don't have an account? <a href="#!" class="text-white fw-bold">Sign Up</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock content %}
